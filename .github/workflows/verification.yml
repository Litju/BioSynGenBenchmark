name: Numerical verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: numerical-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  standard-library:
    name: Python 3.12.10 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Record qualified runtime and source
        run: |
          python --version
          git rev-parse HEAD
      - name: Run complete I0, I1, I2 and I3 suite
        run: python -m unittest discover -s tests -v
      - name: Windows PowerShell controller controls
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tests/test_overnight_controller.ps1
      - name: Independent I1 evaluator challenge suite
        run: python -m scripts.i1_benchmark_suite
      - name: Frozen I0 regression
        run: python -m scripts.i1_i0_regression --output runs/i3/ci/i0-regression.json
      - name: I1 fresh-process reproduction
        run: python -m scripts.run_i1 --replicate --out runs/i3/ci/i1/run
      - name: I3 fresh-process exercise reproduction and benchmark falsifiers
        run: python -m scripts.verify_i3_reproducibility --out runs/i3/ci/i2-reproduction
      - name: Exact-reference manufactured platform probe
        run: python -m scripts.i3_platform_probe --out runs/i3/ci/numeric-probe.json
      - name: Upload numerical provenance and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i3-numeric-${{ matrix.os }}
          path: runs/i3/ci/
          if-no-files-found: error
          retention-days: 30

  scipy-crosscheck:
    name: SciPy DOP853 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Install pinned qualification dependencies
        run: python -m pip install scipy==1.17.1 numpy==2.4.4
      - name: Require independent solver and enforce true test exit
        run: python -m scripts.require_i3_scipy_checks

  cross-platform:
    name: Exact-reference Windows/Linux comparison
    needs: standard-library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: i3-numeric-*
          path: runs/i3/ci/platforms
      - name: Recompute exact errors and certified fixture comparison bounds
        run: python -m scripts.compare_i3_platforms --root runs/i3/ci/platforms --out runs/i3/ci/platform-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: i3-platform-comparison
          path: runs/i3/ci/platform-comparison.json
          if-no-files-found: error
          retention-days: 30
