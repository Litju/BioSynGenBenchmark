name: Numerical verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standard-library:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete I0, I1 and I2 test suite
        run: python -m unittest discover -s tests -v
      - name: Run Windows PowerShell controller checks
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tests\test_overnight_controller.ps1
      - name: Run independent evaluator challenge suite
        run: python -m scripts.i1_benchmark_suite
      - name: Reproduce I0 frozen-artifact comparison
        run: python -m scripts.i1_i0_regression --output runs/i2/res489/ci-i0-regression.json
      - name: Reproduce I1 in two fresh processes
        run: python -m scripts.run_i1 --replicate --out runs/i2/res489/ci-i1/run

  scipy-crosscheck:
    name: SciPy DOP853 qualification / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SciPy qualification dependency
        run: python -m pip install scipy
      - name: Require SciPy and run independent-solver checks
        run: |
          python -c "import scipy; print('SciPy', scipy.__version__)"
          python -m unittest tests.test_i1_solver_crosscheck -v
